<div class="min-h-screen bg-gradient-to-br from-cyan-500 via-blue-500 to-emerald-500 flex items-center justify-center p-6">

  <div class="w-full max-w-3xl bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-cyan-100">

    <!-- TITULO -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-cyan-700">
        Agregar Producto
      </h1>

      <p class="text-gray-500 mt-2">
        Completa la información del producto
      </p>
    </div>

    <!-- FORMULARIO -->
    <form class="space-y-6">

      <!-- GRID -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- NOMBRE -->
        <div>
          <label class="block text-sm font-semibold text-cyan-700 mb-2">
            Nombre del producto
          </label>

          <input
            type="text"
            placeholder="Ejemplo: Laptop Gamer"
            class="w-full px-4 py-3 rounded-2xl border border-cyan-200 bg-cyan-50 focus:outline-none focus:ring-4 focus:ring-cyan-300 transition duration-300"
          />
        </div>

        <!-- PRECIO -->
        <div>
          <label class="block text-sm font-semibold text-blue-700 mb-2">
            Precio
          </label>

          <input
            type="number"
            placeholder="$0.00"
            class="w-full px-4 py-3 rounded-2xl border border-blue-200 bg-blue-50 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-300"
          />
        </div>

        <!-- CATEGORIA -->
        <div>
          <label class="block text-sm font-semibold text-emerald-700 mb-2">
            Categoría
          </label>

          <select
            class="w-full px-4 py-3 rounded-2xl border border-emerald-200 bg-emerald-50 focus:outline-none focus:ring-4 focus:ring-emerald-300 transition duration-300"
          >
            <option>Tecnología</option>
            <option>Ropa</option>
            <option>Hogar</option>
            <option>Comida</option>
          </select>
        </div>

        <!-- STOCK -->
        <div>
          <label class="block text-sm font-semibold text-cyan-700 mb-2">
            Stock
          </label>

          <input
            type="number"
            placeholder="Cantidad disponible"
            class="w-full px-4 py-3 rounded-2xl border border-cyan-200 bg-cyan-50 focus:outline-none focus:ring-4 focus:ring-cyan-300 transition duration-300"
          />
        </div>

      </div>

      <!-- DESCRIPCION -->
      <div>
        <label class="block text-sm font-semibold text-blue-700 mb-2">
          Descripción
        </label>

        <textarea
          rows="4"
          placeholder="Describe el producto..."
          class="w-full px-4 py-3 rounded-2xl border border-blue-200 bg-blue-50 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-300"
        ></textarea>
      </div>

      <!-- IMAGEN -->
      <div>
        <label class="block text-sm font-semibold text-emerald-700 mb-2">
          Imagen del producto
        </label>

        <input
          type="file"
          class="w-full bg-emerald-50 border border-dashed border-emerald-300 rounded-2xl p-4 cursor-pointer hover:bg-emerald-100 transition"
        />
      </div>

      <!-- CHECKBOX -->
      <div class="flex items-center gap-3">
        <input
          type="checkbox"
          class="w-5 h-5 accent-cyan-600"
        />

        <span class="text-gray-700">
          Producto disponible
        </span>
      </div>

      <!-- BOTONES -->
      <div class="flex flex-col md:flex-row gap-4 pt-4">

        <button
          type="submit"
          class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 text-white py-3 rounded-2xl font-bold text-lg shadow-lg hover:scale-105 hover:shadow-2xl transition duration-300"
        >
          Guardar Producto
        </button>

        <button
          type="reset"
          class="flex-1 bg-gradient-to-r from-emerald-200 to-cyan-200 text-cyan-900 py-3 rounded-2xl font-bold text-lg hover:opacity-90 transition duration-300"
        >
          Limpiar
        </button>

      </div>

    </form>

  </div>

</div>
