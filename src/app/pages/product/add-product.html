<div class="add-product-page">
  <div class="add-product-card">
    <div class="card-header">
      <h2>Agregar producto</h2>
    </div>

    <form class="add-product-form" (submit)="saveProduct($event)">
      <label>
        Nombre
        <input
          type="text"
          [(ngModel)]="newProduct.name"
          name="productName"
          placeholder="Nombre del producto"
          required
        />
      </label>

      <label>
        Precio
        <input
          type="number"
          [(ngModel)]="newProduct.price"
          name="productPrice"
          min="0"
          step="0.01"
          placeholder="0.00"
          required
        />
      </label>

      <label>
        Stock
        <input
          type="number"
          [(ngModel)]="newProduct.stock"
          name="productStock"
          min="0"
          step="1"
          placeholder="0"
          required
        />
      </label>

      <div class="form-actions">
        <button type="button" class="secondary-button" (click)="cancel()">Cancelar</button>
        <button type="submit" class="primary-button">Guardar producto</button>
      </div>
    </form>
  </div>
</div>
